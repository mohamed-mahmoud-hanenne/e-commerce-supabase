<div class="container mt-5">
  <h2 class="fw-bold mb-4">Tableau de bord Administrateur</h2>
  
  <div class="card border-0 shadow rounded-4">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4">ID Commande</th>
            <th>Client</th>
            <th>Total (€)</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody>
          @for (order of orders(); track order.id) {
            <tr>
              <td class="ps-4 text-muted small">{{ order.id.slice(0,8) }}...</td>
              <td class="fw-bold">{{ order.profiles?.full_name || 'Client Anonyme' }}</td>
              <td>{{ order.total_price }} €</td>
              <td>
                <select [value]="order.status" (change)="changeStatus(order.id, $event)" 
                        class="form-select form-select-sm rounded-pill"
                        [ngClass]="{'bg-warning-subtle': order.status === 'En attente', 'bg-success-subtle': order.status === 'Livré'}">
                  @for (s of statuses; track s) {
                    <option [value]="s">{{ s }}</option>
                  }
                </select>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
