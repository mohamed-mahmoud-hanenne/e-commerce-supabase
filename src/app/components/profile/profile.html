<div class="container mt-5">
  <div class="card border-0 shadow rounded-4 p-4 mx-auto" style="max-width: 600px;">
    <h3 class="fw-bold mb-4">Mon Profil</h3>
    
    <div class="text-center mb-4">
      <img [src]="profileData.avatar_url || 'assets/default-avatar.png'" 
           class="rounded-circle border shadow-sm" style="width: 120px; height: 120px; object-fit: cover;">
      <div class="mt-2">
        <input type="file" (change)="onFileSelected($event)" class="form-control form-control-sm rounded-pill">
      </div>
    </div>

    <div class="mb-3">
      <label class="small fw-bold">Nom complet</label>
      <input type="text" [(ngModel)]="profileData.full_name" class="form-control rounded-pill">
    </div>

    <div class="mb-4">
      <label class="small fw-bold">Téléphone</label>
      <input type="text" [(ngModel)]="profileData.phone" class="form-control rounded-pill">
    </div>

    <button (click)="saveProfile()" class="btn btn-primary w-100 rounded-pill py-2" [disabled]="loading()">
      {{ loading() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
    </button>
  </div>
</div>
