<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Gestion de mon Stock</h2>
    <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addProductModal">
      + Ajouter un produit
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th class="ps-4">Image</th>
          <th>Nom</th>
          <th>Prix</th>
          <th class="text-end pe-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (p of myProducts(); track p.id) {
          <tr>
            <td class="ps-4"><img [src]="p.image_url" width="45" class="rounded shadow-sm"></td>
            <td class="align-middle fw-semibold">{{ p.name }}</td>
            <td class="align-middle text-primary fw-bold">{{ p.price }} €</td>
            <td class="text-end pe-4">
              <button (click)="onDeleteProduct(p.id)" class="btn btn-sm btn-outline-danger border-0">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center py-5 text-muted">
              Vous n'avez pas encore de produits en vente.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="addProductModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Nouveau Produit</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="small fw-bold">Nom du produit</label>
            <input type="text" [(ngModel)]="newProduct.name" name="name" class="form-control rounded-pill" required>
          </div>
          <div class="mb-3">
            <label class="small fw-bold">Prix (€)</label>
            <input type="number" [(ngModel)]="newProduct.price" name="price" class="form-control rounded-pill" required>
          </div>
          <div class="mb-3">
            <label class="small fw-bold">Catégorie</label>
            <select [(ngModel)]="newProduct.category_id" name="category_id" class="form-select rounded-pill">
              @for (cat of categories(); track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            </select>
          </div>
          <div class="mb-3">
            <label class="small fw-bold">Image</label>
            <input type="file" (change)="onFileSelected($event)" class="form-control rounded-pill">
          </div>
          <button type="submit" [disabled]="loading()" class="btn btn-primary w-100 rounded-pill mt-3">
            @if(loading()) { <span class="spinner-border spinner-border-sm"></span> }
            @else { Publier le produit }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
